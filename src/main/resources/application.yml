spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST}:${POSTGRES_DB_INTERNAL_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  sql:
    init:
      mode: always
      schema-locations: classpath:session-schema.sql
      data-locations: classpath:testData.sql

  session:
    store-type: jdbc

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: networking

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - debug
          - env

server:
  port: ${HTTP_PORT}

jwt:
  secret: ${JWT_SECRET}